services:
  # ---------------------------------------------------------------------------
  # StartupOps AI — Unified Full-Stack Service (Frontend UI + Backend API)
  # ---------------------------------------------------------------------------
  - type: web
    name: startupops-ai
    runtime: python
    buildCommand: ./build.sh
    startCommand: python main.py
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 18.20.4
      - key: ENVIRONMENT
        value: production
      - key: APP_SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_AI_STUDIO_API_KEY
        sync: false
